esphome:
  name: wavin-node
  friendly_name: "Wavin AHC9000 Gateway"
  comment: "Production ESPHome integration for Wavin AHC9000 / Jablotron AC-116 Underfloor Heating Controller"

  # Define Home Assistant Areas in ESPHome
  areas:
    - id: kitchen
      name: "Kitchen-Dining Room"
    - id: guest_toilet
      name: "Guest Toilet"
    - id: bedroom
      name: "Bedroom"
    - id: walk_in
      name: "Walk In"
    - id: walkthrough
      name: "Walkthrough"
    - id: bathroom
      name: "Bathroom"
    - id: kammas_room
      name: "Kamma's Room"
    - id: huberts_room
      name: "Hubert's Room"

  # Modern ESPHome Native Sub-Devices Feature
  devices:
    - id: subdev_kitchen
      name: "Kitchen-Dining Room"
      area_id: kitchen
    - id: subdev_guest_toilet
      name: "Guest Toilet"
      area_id: guest_toilet
    - id: subdev_bedroom
      name: "Bedroom"
      area_id: bedroom
    - id: subdev_walk_in
      name: "Walk In"
      area_id: walk_in
    - id: subdev_walkthrough
      name: "Walkthrough"
      area_id: walkthrough
    - id: subdev_bathroom
      name: "Bathroom"
      area_id: bathroom
    - id: subdev_kamma
      name: "Kamma's Room"
      area_id: kammas_room
    - id: subdev_hubert
      name: "Hubert's Room"
      area_id: huberts_room

external_components:
  - source: github://mathias-jakobsen/esphome_components
    components: [ wavin_ahc9000 ]
    refresh: 0s

esp8266:
  board: esp01_1m

logger:
  level: INFO
  baud_rate: 0

api:

# Serial Communication for Wavin Modbus RTU Bus (38400 bps, 8N1)
uart:
  id: uart_wavin
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 38400
  stop_bits: 1
  data_bits: 8
  parity: NONE

# Instantiate Wavin AHC9000 Hub
wavin_ahc9000:
  id: wavin_hub
  uart_id: uart_wavin
  update_interval: 10s

# ==============================================================================
